name: psos-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PSOS conformance
        run: node scripts/psos-check.mjs skills
      - name: No private identifiers or credentials
        run: |
          # Public skills carry no credentials and no private-system identifiers. The connector address in
          # skills/sicoru-setup is the published public endpoint and is the one allowed exception.
          if grep -rnE '(sb_secret_|sk-ant-|ghp_|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY)' --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::credential-shaped string found"; exit 1; fi
